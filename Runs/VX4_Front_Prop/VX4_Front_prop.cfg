[FILE]
    # Input CAD file (".stp")
    stp_file = VX4_Front_Blade_single.stp
    # Output directory for exporting the files
    output_dir = output
    # Case name which will be used for the file names
    # Ex. --->  output/VX4-front_prop.vtk
    name_tag = VX4-5b_hover_cosine

[SURFACE]
    type = propeller
    n_blades = 5

    # Is LE vertex present in the .stp file?
    # Yes --> find_LE = no
    # No --> find_LE = yes
    find_LE = no
    # Rotational direction of the rotor (CCW - CW)
    rotation = CCW

    close_TE = yes

[PANEL]
    # Root radius
    z_min = 25.6    
    # Tip radius
    z_max = 150.5   
    
    # Number of nodes in chordwise dir (Upper and Lower surf separately!!)
    N_chord = 21
    # Number of sections spanwise dir (Approximately)
    N_span = 48
    
    # Chordwise points distribution    (cosine_LE - uniform)
    dist_chord = cosine_LE
    # Spanwise sections distribution  (polyn_TIP - uniform, cosine)
    dist_span = cosine

    ###     PLANFORM CHANGES    ###
    scale = [0.58629386] # []     # Blade cross section scale
    collect_pitch = [33.45830708] #[32.4]   # Collective Pitch Increment (deg)
    sweep = [-7.62195716] # [0]     # Sweep Increment (deg)
    dihedral = [10]  # [0] Dihedral Increment (deg)
    twist_tip  = [-20] # [0]   # Twist distribution (deg)
    twist_root = [20] # [0]
    
    twist_distr = linear    # Spanwise twist distribution  (linear)

[GENERATE_SURFACE]

    # Reconstruct blade from blade elements??
    # yes --> USE the parameters below
    # no  --> Omit the rest below
    generate_blade = no

    n_sec = 20      # Number of blade sections

    z_min_sec = 26  # Root section span
    z_max_sec = 150 # Tip section span

    # Spanwise sections distribution  (polyn_TIP - uniform)
    dist_sec = polyn_TIP

    collect_pitch_sec = [0, 2]      # Collective Pitch Increment (deg)
    scale_sec = [1, 1.1]            # Blade cross section scale

    # Generate mesh for the new surface??
    # yes --> Use [PANEL] parameters above
    # no  --> Only "step" file will be exported
    generate_mesh = yes
